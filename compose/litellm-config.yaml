# LiteLLM proxy model list — minimum viable.
# Edit to add OpenAI, Cohere, Mistral, local Ollama, etc. as needed.

model_list:
  - model_name: anthropic/claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # identity.toml.example has asked for sonnet-5 since the persona was called
  # `jackdaw`; this list never served it, so compose users have had a latent
  # version of the k8s outage all along. The config asking for sonnet-5 is
  # correct — this list was what lagged.
  # Pinned by tests/test_config_models_are_served.py.
  - model_name: anthropic/claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
