# LiteLLM proxy model list — minimum viable.
# Edit to add OpenAI, Cohere, Mistral, local Ollama, etc. as needed.

model_list:
  - model_name: anthropic/claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: anthropic/claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Local self-hosted model (Qwen3.5-family 9B, Q4_K_M, 256K ctx, tools+thinking)
  # running under Ollama on the LAN Mac, via its OpenAI-compatible endpoint. A
  # non-Anthropic backend — candidate brain for a hosted/sovereign persona.
  # Ollama ignores the api_key, but the openai provider requires one to be set.
  - model_name: ornith
    litellm_params:
      model: openai/ornith:9b
      api_base: http://192.168.10.118:11434/v1
      api_key: "ollama-local"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
