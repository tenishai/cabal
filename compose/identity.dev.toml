# identity.dev.toml — minimal identity for the docker-compose.dev.yml stack.
# Mounted read-only into the cabal container at /app/identity.toml.
#
# No LiteLLM URL — the dev stack has no proxy. Dispatch to persona LLM
# endpoints won't work, but the MCP layer (liminal tools) works fine.

[cabal]
operator_id = "dev"
# On the volume, not in the container's writable layer (#214). The image also
# sets CABAL_DATA_DIR=/data, which wins over this; it is here so the file says
# where the state lives.
data_dir = "/data"

[liminal]
url = "http://liminal:9100"
# liminal validates tokens against cabal's JWKS; cabal mints tokens for
# persona dispatch. No extra config needed for the basic flow.

[personas.demo]
role   = "singleton"
safety_tier = "moderate"

[personas.demo.mcp]
enabled          = true
allowed_handlers = ["scratchpad", "notify", "web"]
# Add more handlers as needed. Empty list would lock the persona out.
