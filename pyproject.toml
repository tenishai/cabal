[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cabal"
version = "0.1.0"
description = "Self-hosted personal agent orchestration platform"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Richard DiMartino" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "typer>=0.13",
    "authlib>=1.4",
    "cryptography>=44",
    "httpx>=0.27",
    "structlog>=24.4",
    "tomli>=2.0;python_version<'3.13'",
    # techne is installed separately from the local sibling checkout during
    # development (see CABAL-DECISIONS.md D-008). Once techne 0.6.0 is
    # published to PyPI or a private index, add `techne>=0.6.0` here.
]

[project.optional-dependencies]
# `mcp` pulls in limenal so personas with `[mcp].enabled = true` in
# identity.toml can connect to a limenal gateway. Without this extra,
# cabal still runs — personas without an [mcp] block work fine; personas
# with one fail at first dispatch with a clear "install cabal[mcp]" error.
mcp = ["limenal>=0.1"]

# `memory` pulls in techne for the Archivist persona + any persona that
# binds a TechneMemoryStore. Same shape — cabal runs without it; personas
# that need it raise a clear error pointing at this extra.
memory = ["techne>=0.6.1"]

# Everything wired together, for the canonical platform install.
full = ["limenal>=0.1", "techne>=0.6.1"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
cbl = "cabal.cli.main:app"

[project.urls]
Source = "https://github.com/dimartin/cabal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ASYNC"]
ignore = [
    "E501",     # line-length handled by formatter
    "B008",     # typer.Option/Argument in defaults is the standard pattern
    "ASYNC240", # pathlib in async — cost is sub-ms; switching to anyio.path here is churn
    "UP036",    # sys.version_info guard kept for tomli fallback documentation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B017",  # pytest.raises(Exception) is sometimes correct in tests
    "E702",  # multi-statement-per-line is fine in compact test setup
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
