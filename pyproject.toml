[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenish-cabal"
version = "0.3.0"
description = "Self-hosted personal agent orchestration platform"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "tenish" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "typer>=0.13",
    "joserfc>=1.6.1",
    "cryptography>=44",
    "httpx>=0.27",
    "structlog>=24.4",
    "tomli>=2.0;python_version<'3.13'",
    # HARD RUNTIME DEPENDENCY, declared nowhere until cabal#88. `import litellm`
    # is deliberately LAZY (core/app.py, "heavy module", keeps tests offline),
    # so `import cabal` succeeded without it and a clean install booted, reached
    # the TUI, and died at FIRST DISPATCH with ModuleNotFoundError -- which
    # reads as a runtime bug rather than a missing dependency. That is why it
    # survived: every dev venv already had it from an earlier revision. Floor is
    # the version the issue verified, not a guess.
    "litellm>=1.92",
    # techne + liminal are optional extras (see [project.optional-dependencies]
    # below: `mcp`, `memory`, `full`). Neither is on a public index; the concrete
    # git sources are pinned in `requirements-sources.txt` for clean-machine
    # installs. Dev/CI keep editable sibling checkouts (`-e ../techne -e ../liminal`; D-008).
]

[project.optional-dependencies]
# `mcp` pulls in liminal so personas with `[mcp].enabled = true` in
# identity.toml can connect to a liminal gateway. Without this extra,
# cabal still runs — personas without an [mcp] block work fine; personas
# with one fail at first dispatch with a clear "install tenish-cabal[mcp]" error.
mcp = ["tenish-liminal>=0.4"]
tui = ["textual>=1.0"]

# `memory` pulls in techne for the Archivist persona + any persona that
# binds a TechneMemoryStore. Same shape — cabal runs without it; personas
# that need it raise a clear error pointing at this extra.
memory = ["tenish-techne>=0.18.2"]

# Everything wired together, for the canonical platform install.
full = ["tenish-liminal>=0.4", "tenish-techne>=0.18.2"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    # tests/test_config_models_are_served.py parses the shipped k8s + compose
    # YAML. It was already importable transitively (litellm pulls pyyaml), which
    # is precisely why it needs declaring: a transitive dep that disappears on a
    # dependency bump takes the test with it, and that test exists to catch
    # config-vs-config drift that nothing else checks.
    "pyyaml>=6.0",
]

[project.scripts]
cbl = "cabal.cli.main:app"
cabal = "cabal.tui.main:app"

# Cabal-shipped MCP handlers — liminal discovers them via this entry-point
# group when liminal is installed alongside cabal. Each handler exposes a
# slice of cabal's substrate (Architect's patterns corpus today, more
# personas to follow) through liminal's standard wire protocol.
[project.entry-points."liminal.handlers"]
patterns = "cabal.handlers.patterns:get_handler"
documents = "cabal.handlers.documents:get_handler"
code = "cabal.handlers.code:get_handler"
archivist = "cabal.handlers.archivist:get_handler"

[project.urls]
Source = "https://github.com/tenishai/cabal"

[tool.setuptools.packages.find]
where = ["src"]

# MIGRATIONS SHIP WITH THE PACKAGE (cabal#79). They live under src/cabal/ and
# carry no __init__.py, so `packages.find` does not pick them up -- without
# this stanza a wheel contains no migrations and a non-editable install cannot
# reach `upgrade head`. `versions/*.py` are data here, not modules: alembic
# loads them by path.
[tool.setuptools.package-data]
cabal = ["migrations/env.py", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# WITHOUT THIS, `pytest` IN A WORKTREE TESTS THE CANONICAL CHECKOUT. `import
# cabal` resolves through whatever is installed — normally an editable install
# pointing at the main clone — so a branch's changes are invisible and the run
# is green about code you are not looking at. A new MODULE fails loudly
# (ModuleNotFoundError), which is how this was found; an edited one passes
# silently, which is worse. Same defect as liminal#85.
pythonpath = ["src"]
markers = [
    "integration: spins up a live daemon / external service; excluded from the unit CI job (which runs `-m 'not integration'`) and covered by the integration job. Runs locally by default.",
]

[tool.ruff]
line-length = 100
# ALEMBIC-GENERATED REVISIONS ARE NOT LINTED, and this PRESERVES the existing
# scope rather than newly exempting anything (cabal#79). They lived at the repo
# root until the move, and CI runs `ruff check src tests` -- so they have never
# been in the lint path. Making them shippable by moving them under src/ would
# otherwise drag them in, and alembic's own template emits the shapes ruff
# objects to (`Union[str, None]`, unsorted imports), so every future
# `alembic revision` would fail lint on generated code nobody wrote.
extend-exclude = ["src/cabal/migrations"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ASYNC"]
ignore = [
    "E501",     # line-length handled by formatter
    "B008",     # typer.Option/Argument in defaults is the standard pattern
    "ASYNC240", # pathlib in async — cost is sub-ms; switching to anyio.path here is churn
    "UP036",    # sys.version_info guard kept for tomli fallback documentation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B017",  # pytest.raises(Exception) is sometimes correct in tests
    "E702",  # multi-statement-per-line is fine in compact test setup
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
