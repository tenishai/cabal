# The release image: what a pushed vX.Y.Z tag turns into. Nothing else publishes an
# image (agora issue 58). Copied from tenishai/sero's release.yml. In order, and each
# step has to pass for the next to run:
#
#   1. the whole of test.yml, on the tagged commit
#   2. the tag names the version pyproject.toml declares
#   3. the image, built for this machine: it starts and reports that version, and it has
#      no high or critical vulnerability that has a fix
#   4. the multi-arch image, published to ghcr under the tag and the short commit sha,
#      with an SBOM and build provenance attached
#   5. the GitHub release: created from CHANGELOG.md if it does not exist yet, with the
#      SBOM and its checksum as files and the image digest in the text. The wheel is
#      still published by hand (RELEASING.md).
#
# techne comes from a checkout of the tag the Dockerfile pins (TECHNE_VERSION), as in
# test.yml's docker job, so the build needs no index token. The image carries no liminal,
# which suits an identity with no `[liminal] url`, as k8s/ ships.
#
# To build a tag again, run this workflow from that tag (the tag must contain this file):
#   gh workflow run release.yml --ref vX.Y.Z
# If that tag's image is already on ghcr, the run does not push it again: a rebuild gets a
# new digest, and nodes with `imagePullPolicy: IfNotPresent` would run different images
# under one tag. It finishes the GitHub release with the published digest instead.
#
# A dry run, from a branch, does steps 1 and 3 and makes the SBOM and checksums, and
# publishes nothing:
#   gh workflow run release.yml --ref main
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  checks:
    uses: ./.github/workflows/test.yml

  release:
    name: release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: cabal

      - name: The tag names the version the project declares (a branch is a dry run)
        id: version
        working-directory: cabal
        run: |
          declared="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$tag is not a vX.Y.Z tag; run this workflow from a release tag"; exit 1;; esac
            [ "${tag#v}" = "$declared" ] || { echo "::error::tag $tag but pyproject.toml declares $declared"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            tag="dry-run"
            echo "::notice::dry run from $GITHUB_REF_NAME: build, check and scan only; nothing is published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "techne=v$(sed -n 's/^ARG TECHNE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
          mkdir -p ../dist

      - name: Checkout techne at the tag the Dockerfile pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/techne
          ref: ${{ steps.version.outputs.techne }}
          path: techne

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this tag's image already published
        id: published
        if: steps.version.outputs.publish == 'true'
        env:
          REF: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
        run: |
          if digest="$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" && [ -n "$digest" ]; then
            echo "::notice::$REF is already published ($digest); this run will not push it again"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the image for this machine
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: cabal
          build-contexts: techne=techne
          load: true
          pull: true
          tags: candidate:release
          # The day goes in so the OS package upgrade runs again instead of coming out of the cache.
          build-args: APT_REFRESH=${{ steps.version.outputs.day }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: The image starts and reports the tagged version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          got="$(docker run --rm candidate:release python -c 'import cabal; print(cabal.__version__)')"
          echo "image reports $got"
          [ "$got" = "$VERSION" ] || { echo "::error::image reports $got, tag says $VERSION"; exit 1; }
          docker run --rm candidate:release cbl --help > /dev/null

      - name: No high or critical vulnerability that has a fix
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: candidate:release
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: candidate:release
          format: spdx-json
          output-file: dist/${{ github.event.repository.name }}-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Build and publish, both architectures
        id: build
        if: steps.version.outputs.publish == 'true' && steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: cabal
          build-contexts: techne=techne
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: APT_REFRESH=${{ steps.version.outputs.day }}
          # Layers that did not change come from the last build instead of being rebuilt
          # for both architectures; mode=max also caches the intermediate stages.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}

      - name: The GitHub release
        if: steps.version.outputs.publish == 'true'
        working-directory: cabal
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest || steps.published.outputs.digest }}
        run: |
          line="Image: \`${IMAGE}@${DIGEST}\` (tags \`${TAG}\`, \`${SHA}\`; linux/amd64, linux/arm64)"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Notes are this version's section of the changelog.
            awk -v v="$VERSION" '/^## \[/{on = index($0, "## [" v "]") == 1; next} on' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" ../dist/* --clobber
          gh release view "$TAG" --json body --jq .body > body.md
          grep -qF "$DIGEST" body.md || { printf '\n\n%s\n' "$line" >> body.md; gh release edit "$TAG" --notes-file body.md; }
