name: test

# Every job runs on GitHub-hosted runners: this repo is public, and no runner we
# operate may be reachable from it. tests/test_ci_workflow.py pins that.
# unit runs on every push to main and every pull request, fork PRs included —
# no private deps, no secret required.
# integration and docker run with unit on every push, PR and dispatch.
# integration clones the public techne and liminal siblings and docker clones
# techne, all without a token, so fork PRs need no secret either. Both were
# dispatch-only while the siblings were private (issue 236).
# `ci` and `dco` are the two checks a branch ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- unit: no sibling deps; push, dispatch, every pull request ------------
  # No `if:` on purpose: a skipped unit would leave fork PRs ungated. The `ci` job
  # below turns anything but success into a failure.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout cabal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: cabal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cabal/pyproject.toml

      - name: Install (no siblings)
        working-directory: cabal
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: cabal
        run: ruff check src tests

      - name: Architecture cards are current
        # Each card pins the file it describes by blob sha; a seam that changed
        # without its card fails here (see AGENTS.md).
        working-directory: cabal
        run: python scripts/check_arch_cards.py

      - name: Pytest (unit — sibling tests auto-skip; live-daemon tests excluded)
        working-directory: cabal
        run: pytest -q -m "not integration"

  # ---- dco: every commit a PR adds carries a matching Signed-off-by ---------
  # Copied from tenishai/techne's test.yml (CONTRIBUTING.md, "Developer
  # Certificate of Origin"). Hosted runner, no install step: it only reads git
  # history, so there is no PR code to execute. Matches the sign-off anywhere in
  # the message (a hook that appends a trailer moves it out of git's trailer block).
  #
  # DEPENDABOT EXEMPTION: a commit authored EXACTLY as
  # `dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>` is
  # skipped. Dependabot signs off as `dependabot[bot] <support@github.com>`, which
  # never matches its noreply author email, so its PRs failed otherwise. The exemption applies only when the PR's head is
  # this repository: a fork can forge any commit author, including this one, and
  # gets no exemption.
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout cabal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: DCO sign-off check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOT_EXEMPT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --unshallow origin "$BASE_SHA" "$HEAD_SHA"
          else
            git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA"
          fi
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "::error::DCO: no non-merge commits in $BASE_SHA..$HEAD_SHA, so nothing was checked"
            exit 1
          fi
          bad=0
          skipped=0
          for c in $commits; do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if [ "$BOT_EXEMPT" = true ] && [ "$author" = "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" ]; then
              echo "DCO: skipping ${c:0:12} as a bot commit ($author)"
              skipped=$((skipped + 1))
              continue
            fi
            # no `grep -q`: an early exit SIGPIPEs `tr`, and pipefail reads that as a miss
            if ! git log -1 --format=%B "$c" | tr -d '\r' | grep -Fxi -- "Signed-off-by: $author" >/dev/null; then
              echo "::error::DCO: commit ${c:0:12} has no 'Signed-off-by: $author' trailer"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. To fix existing commits, see 'Developer Certificate of Origin' in CONTRIBUTING.md."
            exit 1
          fi
          echo "DCO: $(($(echo "$commits" | wc -l | tr -d ' ') - skipped)) commit(s) signed off by their authors$( [ "$skipped" -gt 0 ] && printf ' (%s skipped as bot commits)' "$skipped" )"

  # ---- integration: full suite with siblings --------------------------------
  # No `if:`, same as unit: `ci` needs it, so a skip would fail the gate.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false

    steps:
      - name: Checkout cabal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: cabal

      # The same pinned techne the image builds with (see the docker job).
      - name: Read the pinned techne version
        id: techne
        working-directory: cabal
        run: echo "ref=v$(sed -n 's/^ARG TECHNE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/techne
          ref: ${{ steps.techne.outputs.ref }}
          path: techne

      - name: Checkout liminal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/liminal
          path: liminal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cabal/pyproject.toml

      - name: Install (with siblings)
        working-directory: cabal
        run: |
          python -m pip install --upgrade pip
          pip install -e "../techne"
          pip install -e "../liminal"
          pip install -e ".[dev]"

      - name: Pytest (full suite)
        working-directory: cabal
        run: pytest -q

  # ---- docker: the image builds, and the built venv imports cabal -----------
  # Exists because PR #123's headline bug (a stale build/ dir shipping an
  # empty cabal package) lived only inside a built image, where no pytest
  # runs. The Dockerfile's own `import cabal; assert cabal.__version__`
  # build proof is the guard; this job is what makes it fire in CI.
  # techne is a sibling brought in via --build-context and cloned without a
  # token. No `if:`, same as integration: `ci` needs it.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cabal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: cabal

      # techne at the tag the Dockerfile pins, read from its TECHNE_VERSION so
      # there is one place to change. Unpinned, this built whatever techne's
      # main was that day, which can report the same version as the tag.
      - name: Read the pinned techne version
        id: techne
        working-directory: cabal
        run: echo "ref=v$(sed -n 's/^ARG TECHNE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/techne
          ref: ${{ steps.techne.outputs.ref }}
          path: techne

      - name: Build the image (build proof asserts cabal imports with a version)
        working-directory: cabal
        # --pull: never trust a runner's cached python:3.12-slim base layer —
        # a stale base ships weeks-old packages with published CVE fixes missing.
        run: docker build --pull --build-arg APT_REFRESH="$(date +%F)" --build-context techne=../techne -t cabal:ci .

  # ---- ci: the one check a branch ruleset requires, with dco ----------------
  # Required by name, so it must always report. `if: always()` runs it when unit,
  # integration or docker fails or is cancelled, and the step fails on anything
  # but success from any of them: a skipped
  # job counts as passing in GitHub's UI, and must not here.
  ci:
    runs-on: ubuntu-latest
    needs: [unit, integration, docker]
    if: always()
    steps:
      - name: Fail unless unit, integration and docker succeeded
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          echo "unit: $UNIT_RESULT"
          echo "integration: $INTEGRATION_RESULT"
          echo "docker: $DOCKER_RESULT"
          [ "$UNIT_RESULT" = success ] && [ "$INTEGRATION_RESULT" = success ] && [ "$DOCKER_RESULT" = success ]
