name: test

# unit runs on every push/PR — no private deps, no secret required.
# integration runs on workflow_dispatch and pushes to main — requires
# GH_PAT_REPOS to clone the private techne and liminal sibling repos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- unit: no sibling deps, always runs -----------------------------------
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout cabal
        uses: actions/checkout@v4
        with:
          path: cabal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cabal/pyproject.toml

      - name: Install (no siblings)
        working-directory: cabal
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: cabal
        run: ruff check src tests

      - name: Pytest (unit — sibling tests auto-skip; live-daemon tests excluded)
        working-directory: cabal
        run: pytest -q -m "not integration"

  # ---- integration: full suite with siblings --------------------------------
  integration:
    # Manual dispatch only until GH_PAT_REPOS secret is added.
    # Once that's available, can re-enable `|| github.ref == 'refs/heads/main'`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false

    steps:
      - name: Checkout cabal
        uses: actions/checkout@v4
        with:
          path: cabal

      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          repository: tenishai/techne
          token: ${{ secrets.GH_PAT_REPOS }}
          path: techne

      - name: Checkout liminal
        uses: actions/checkout@v4
        with:
          repository: tenishai/liminal
          token: ${{ secrets.GH_PAT_REPOS }}
          path: liminal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cabal/pyproject.toml

      - name: Install (with siblings)
        working-directory: cabal
        run: |
          python -m pip install --upgrade pip
          pip install -e "../techne"
          pip install -e "../liminal"
          pip install -e ".[dev]"

      - name: Pytest (full suite)
        working-directory: cabal
        run: pytest -q

  # ---- docker: the image builds, and the built venv imports cabal -----------
  # Exists because PR #123's headline bug (a stale build/ dir shipping an
  # empty cabal package) lived only inside a built image, where no pytest
  # runs. The Dockerfile's own `import cabal; assert cabal.__version__`
  # build proof is the guard; this job is what makes it fire in CI.
  # Same gating as integration: techne is a private sibling brought in via
  # --build-context, so this needs GH_PAT_REPOS. Manual dispatch only until
  # that secret is added; then re-enable `|| github.ref == 'refs/heads/main'`.
  docker:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cabal
        uses: actions/checkout@v4
        with:
          path: cabal

      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          repository: tenishai/techne
          token: ${{ secrets.GH_PAT_REPOS }}
          path: techne

      - name: Build the image (build proof asserts cabal imports with a version)
        working-directory: cabal
        run: docker build --build-context techne=../techne -t cabal:ci .
