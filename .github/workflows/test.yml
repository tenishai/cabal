name: test

# unit runs on every push to main and every same-repo PR (fork PRs run fork-pr,
# its hosted twin) — no private deps, no secret required.
# integration runs on workflow_dispatch only. It clones the techne and liminal
# siblings without a token, so it works once they are public (agora#27).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- unit: no sibling deps; push, dispatch, same-repo PRs -----------------
  # Fork PRs run fork-pr instead. tests/test_ci_workflow.py pins the guard below.
  # unit runs on a self-hosted runner pool. The `if:` below is DEFENCE IN DEPTH for
  # honest fork PRs, not a security boundary: for `pull_request` GitHub runs the PR's
  # own copy of this file, so a fork can delete the guard (see the ATTACKER-EDITABLE
  # block in tenishai/techne's test.yml). The real controls are the repository's
  # "Run workflows from fork pull requests" setting and keeping the self-hosted
  # runner off any repository that accepts untrusted PRs.
  unit:
    runs-on: [self-hosted, linux, x64, cabal-ci]
    timeout-minutes: 20  # one small runner; a hung job starves it
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout cabal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: cabal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cabal/pyproject.toml
      # The runner CONTAINER persists between jobs (same machine name across legs), so
      # setup-python's interpreter is shared on the runner: a bare `pip install` would
      # let one job's packages satisfy the next job's imports (liminal#103 r1). A fresh
      # venv per job, first on PATH, keeps each run to what it installed itself.
      # setup-python stays (proven on this runner) rather than the image's interpreters.
      - name: Fresh venv for this job
        run: |
          python -m venv --clear "$GITHUB_WORKSPACE/.venv-ci"
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Install (no siblings)
        working-directory: cabal
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: cabal
        run: ruff check src tests

      - name: Pytest (unit — sibling tests auto-skip; live-daemon tests excluded)
        working-directory: cabal
        run: pytest -q -m "not integration"

  # ---- dco: every commit a PR adds carries a matching Signed-off-by ---------
  # Copied from tenishai/techne's test.yml (CONTRIBUTING.md, "Developer
  # Certificate of Origin"). Hosted runner, no install step: it only reads git
  # history, so there is no PR code to execute and no reason to use the
  # self-hosted pool. Matches the sign-off anywhere in the message (a hook that
  # appends a trailer moves it out of git's trailer block).
  #
  # DEPENDABOT EXEMPTION: a commit authored EXACTLY as
  # `dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>` is
  # skipped. Dependabot signs off as `dependabot[bot] <support@github.com>`, which
  # never matches its noreply author email, so its PRs failed otherwise. Unlike
  # techne's arch-cards copy, this one runs on hosted infrastructure for fork PRs
  # too, so the exemption applies only when the PR's head is this repository: a
  # fork can forge any commit author, including this one, and gets no exemption.
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout cabal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: DCO sign-off check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BOT_EXEMPT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --unshallow origin "$BASE_SHA" "$HEAD_SHA"
          else
            git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA"
          fi
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "::error::DCO: no non-merge commits in $BASE_SHA..$HEAD_SHA, so nothing was checked"
            exit 1
          fi
          bad=0
          skipped=0
          for c in $commits; do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if [ "$BOT_EXEMPT" = true ] && [ "$author" = "dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>" ]; then
              echo "DCO: skipping ${c:0:12} as a bot commit ($author)"
              skipped=$((skipped + 1))
              continue
            fi
            # no `grep -q`: an early exit SIGPIPEs `tr`, and pipefail reads that as a miss
            if ! git log -1 --format=%B "$c" | tr -d '\r' | grep -Fxi -- "Signed-off-by: $author" >/dev/null; then
              echo "::error::DCO: commit ${c:0:12} has no 'Signed-off-by: $author' trailer"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. To fix existing commits, see 'Developer Certificate of Origin' in CONTRIBUTING.md."
            exit 1
          fi
          echo "DCO: $(($(echo "$commits" | wc -l | tr -d ' ') - skipped)) commit(s) signed off by their authors$( [ "$skipped" -gt 0 ] && printf ' (%s skipped as bot commits)' "$skipped" )"

  # ---- integration: full suite with siblings --------------------------------
  integration:
    # Manual dispatch only. The sibling checkouts carry no token: while techne
    # and liminal are private this job cannot clone them, and once they are
    # public it can. Then consider `|| github.ref == 'refs/heads/main'`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, cabal-ci]
    timeout-minutes: 20  # one small runner; a hung job starves it
    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false

    steps:
      - name: Checkout cabal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: cabal

      # The same pinned techne the image builds with (see the docker job).
      - name: Read the pinned techne version
        id: techne
        working-directory: cabal
        run: echo "ref=v$(sed -n 's/^ARG TECHNE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/techne
          ref: ${{ steps.techne.outputs.ref }}
          path: techne

      - name: Checkout liminal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/liminal
          path: liminal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cabal/pyproject.toml
      # The runner CONTAINER persists between jobs (same machine name across legs), so
      # setup-python's interpreter is shared on the runner: a bare `pip install` would
      # let one job's packages satisfy the next job's imports (liminal#103 r1). A fresh
      # venv per job, first on PATH, keeps each run to what it installed itself.
      # setup-python stays (proven on this runner) rather than the image's interpreters.
      - name: Fresh venv for this job
        run: |
          python -m venv --clear "$GITHUB_WORKSPACE/.venv-ci"
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"

      - name: Install (with siblings)
        working-directory: cabal
        run: |
          python -m pip install --upgrade pip
          pip install -e "../techne"
          pip install -e "../liminal"
          pip install -e ".[dev]"

      - name: Pytest (full suite)
        working-directory: cabal
        run: pytest -q

  # ---- docker: the image builds, and the built venv imports cabal -----------
  # Exists because PR #123's headline bug (a stale build/ dir shipping an
  # empty cabal package) lived only inside a built image, where no pytest
  # runs. The Dockerfile's own `import cabal; assert cabal.__version__`
  # build proof is the guard; this job is what makes it fire in CI.
  # Same gating as integration: techne is a sibling brought in via
  # --build-context and cloned without a token, so this works once techne is
  # public. Manual dispatch only until then.
  docker:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cabal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: cabal

      # techne at the tag the Dockerfile pins, read from its TECHNE_VERSION so
      # there is one place to change. Unpinned, this built whatever techne's
      # main was that day, which can report the same version as the tag.
      - name: Read the pinned techne version
        id: techne
        working-directory: cabal
        run: echo "ref=v$(sed -n 's/^ARG TECHNE_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Checkout techne
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: tenishai/techne
          ref: ${{ steps.techne.outputs.ref }}
          path: techne

      - name: Build the image (build proof asserts cabal imports with a version)
        working-directory: cabal
        # --pull: never trust a runner's cached python:3.12-slim base layer —
        # a stale base ships weeks-old packages with published CVE fixes missing.
        run: docker build --pull --build-arg APT_REFRESH="$(date +%F)" --build-context techne=../techne -t cabal:ci .

  # ---- fork-pr: the complement of unit's guard, on a hosted runner -----------
  fork-pr:
    runs-on: ubuntu-latest
    # Techne's spelling (#590): the literal negation, so an event nobody named still
    # gets a hosted run instead of an empty Checks tab.
    if: ${{ !(github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout cabal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: cabal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cabal/pyproject.toml

      - name: Install (no siblings)
        working-directory: cabal
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: cabal
        run: ruff check src tests

      - name: Pytest (unit — sibling tests auto-skip; live-daemon tests excluded)
        working-directory: cabal
        run: pytest -q -m "not integration"
