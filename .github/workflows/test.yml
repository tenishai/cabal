name: test

# unit runs on every push/PR — no private deps, no secret required.
# integration runs on workflow_dispatch and pushes to main — requires
# GH_PAT_REPOS to clone the private techne and limenal sibling repos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- unit: no sibling deps, always runs -----------------------------------
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout cabal
        uses: actions/checkout@v4
        with:
          path: cabal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cabal/pyproject.toml

      - name: Install (no siblings)
        working-directory: cabal
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: cabal
        run: ruff check src tests

      - name: Pytest (unit — sibling tests auto-skip; live-daemon tests excluded)
        working-directory: cabal
        run: pytest -q -m "not integration"

  # ---- integration: full suite with siblings --------------------------------
  integration:
    # Manual dispatch only until GH_PAT_REPOS secret is added.
    # Once that's available, can re-enable `|| github.ref == 'refs/heads/main'`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false

    steps:
      - name: Checkout cabal
        uses: actions/checkout@v4
        with:
          path: cabal

      - name: Checkout techne
        uses: actions/checkout@v4
        with:
          repository: dimartin/techne
          token: ${{ secrets.GH_PAT_REPOS }}
          path: techne

      - name: Checkout limenal
        uses: actions/checkout@v4
        with:
          repository: dimartin/limenal
          token: ${{ secrets.GH_PAT_REPOS }}
          path: limenal

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cabal/pyproject.toml

      - name: Install (with siblings)
        working-directory: cabal
        run: |
          python -m pip install --upgrade pip
          pip install -e "../techne"
          pip install -e "../limenal"
          pip install -e ".[dev]"

      - name: Pytest (full suite)
        working-directory: cabal
        run: pytest -q
