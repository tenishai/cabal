# Gojira deploy contract for Cabal Core (docs: tenishai/gojira
# docs/design.md "gojira.yaml"). Gojira generates the Deployment, Service,
# workflow and per-environment overlays from this; k8s/base holds the one
# object it does not generate (the data PVC) and keeps as app-authored.
#
# The flat manifests in k8s/*.yaml remain the standalone path
# (`kubectl apply -k k8s/`, see k8s/README.md). Two things differ here:
# LiteLLM is its own Gojira app (service `litellm`, reached through
# identity.toml's [litellm] api_base), and there is no Litestream sidecar —
# the PVC alone carries the database.
app: cabal
class: gateway                 # one replica, Recreate: SQLite on a volume
environments:
  - name: dev
    cluster: gojira-sandbox
    namespace: cabal
port: 7400
health: /healthz
# Built on an arm64 runner and scheduled on arm64 nodes; Autopilot provides
# those through its Scale-Out compute class.
arch: arm64
node_selector:
  cloud.google.com/compute-class: Scale-Out
# techne comes from a package index at build time (Dockerfile, techne
# stage); the index token is added by the platform.
build_args:
  EXTRA_INDEX_URL: https://us-central1-python.pkg.dev/shaz-learning/tenish/simple/
# CABAL_MASTER_KEY and LITELLM_MASTER_KEY, as env (k8s/secret.example.yaml
# has the shape). Created in the namespace out of band, never in git.
secrets_from:
  - cabal-secrets
# identity.toml is environment config (which LiteLLM, which models, which
# personas), so it is a ConfigMap made per environment, not a file in git.
config_mounts:
  - { name: cabal-config, path: /app/identity.toml, key: identity.toml }
# /data: cabal.db, techne.db, keys. The image runs as uid 10001.
data_mount: { pvc: cabal-data, path: /data, fs_group: 10001 }
