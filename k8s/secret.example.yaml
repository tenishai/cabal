# Copy to secret.yaml, fill in real values, kubectl apply. NEVER commit
# the populated secret.yaml — only this template.
#
# Better: use external-secrets / sealed-secrets / sops in production.

apiVersion: v1
kind: Secret
metadata:
  name: cabal-secrets
  namespace: cabal
type: Opaque
stringData:
  # Generate once with:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  CABAL_MASTER_KEY: "REPLACE_ME"

  # Any 32+ char random string.
  LITELLM_MASTER_KEY: "REPLACE_ME"

  # Upstream provider key the LiteLLM proxy uses.
  ANTHROPIC_API_KEY: "REPLACE_ME"

  # Optional — only if [langfuse] is enabled in identity.toml.
  # LANGFUSE_PUBLIC_KEY: "..."
  # LANGFUSE_SECRET_KEY: "..."
