# Generated by Gojira. Sizing comes from the 'gateway' workload class —
# override in gojira.yaml with a justification, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabal
  labels:
    app.kubernetes.io/name: cabal
    gojira.dev/managed: "true"
    gojira.dev/class: gateway
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cabal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cabal
        gojira.dev/managed: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7400"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        fsGroup: 10001
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/compute-class: "Scale-Out"
      tolerations:
        - { key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule }
      containers:
        - name: app
          image: gojira-app
          ports:
            - name: http
              containerPort: 7400
          envFrom:
            - secretRef:
                name: cabal-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cm-cabal-config
              mountPath: /app/identity.toml
              subPath: identity.toml
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 4Gi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 8Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cabal-data
        - name: cm-cabal-config
          configMap:
            name: cabal-config
