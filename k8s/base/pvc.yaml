# SQLite (CABAL_DB_URL=sqlite+aiosqlite:////data/cabal.db), the techne DB
# and the signing keys. One replica mounts it (gojira class: gateway).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cabal-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
