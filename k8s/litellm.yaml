apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabal-litellm
  namespace: cabal
  labels:
    app.kubernetes.io/name: cabal
    app.kubernetes.io/component: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cabal
      app.kubernetes.io/component: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cabal
        app.kubernetes.io/component: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cabal-secrets
                  key: LITELLM_MASTER_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cabal-secrets
                  key: ANTHROPIC_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: cabal-litellm-config

---
apiVersion: v1
kind: Service
metadata:
  name: cabal-litellm
  namespace: cabal
spec:
  selector:
    app.kubernetes.io/name: cabal
    app.kubernetes.io/component: litellm
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
