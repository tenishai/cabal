# docker-compose.dev.yml — minimal local dev stack: cabal + limenal only.
# No LiteLLM, no Litestream. Use for end-to-end MCP tool-call testing.
#
# Required env (in .env next to this file — `make up` auto-creates it):
#   CABAL_MASTER_KEY     — 32-byte url-safe base64 key; auto-generated by `make up`
#   LIMENAL_CABAL_TOKEN  — secrets-fetch JWT; populated by `make bootstrap`
#
# Quickstart:
#   make up          # starts services, auto-generates .env on first run
#   make bootstrap   # trade bootstrap code for tokens, restarts limenal
#   make demo        # runs a scratchpad round-trip to verify the stack

services:
  cabal:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        techne: ../techne
    container_name: cabal-dev
    restart: unless-stopped
    environment:
      CABAL_MASTER_KEY: ${CABAL_MASTER_KEY:?CABAL_MASTER_KEY must be set — run `make up` to auto-generate}
    ports:
      - "127.0.0.1:7400:7400"
    volumes:
      - cabal-dev-data:/data
      - ./compose/identity.dev.toml:/app/identity.toml:ro
    networks:
      - cabal-dev

  limenal:
    build:
      context: ../limenal
      dockerfile: Dockerfile
      additional_contexts:
        techne: ../techne
    container_name: limenal-dev
    restart: unless-stopped
    environment:
      LIMENAL_CABAL_TOKEN: ${LIMENAL_CABAL_TOKEN:-}
    command:
      - limenal
      - serve
      - --host=0.0.0.0
      - --port=9100
      - --jwks-url=http://cabal:7400/.well-known/jwks.json
      - --cabal-url=http://cabal:7400
    ports:
      - "127.0.0.1:9100:9100"
    depends_on:
      cabal:
        condition: service_healthy
    networks:
      - cabal-dev

volumes:
  cabal-dev-data:

networks:
  cabal-dev:
    driver: bridge
