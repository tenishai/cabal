# docker-compose.dev.yml — minimal local dev stack: cabal + liminal only.
# No LiteLLM, no Litestream. Use for end-to-end MCP tool-call testing.
#
# Required env (in .env next to this file — `make up` auto-creates it):
#   CABAL_MASTER_KEY     — 32-byte url-safe base64 key; auto-generated by `make up`
#   LIMINAL_CABAL_TOKEN  — secrets-fetch JWT; populated by `make bootstrap`
#
# Quickstart:
#   make up          # starts services, auto-generates .env on first run
#   make bootstrap   # trade bootstrap code for tokens, restarts liminal
#   make demo        # runs a scratchpad round-trip to verify the stack

services:
  cabal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_REFRESH: ${APT_REFRESH:-unset}   # make exports the date; see Dockerfile
        TECHNE_ANY_VERSION: ${TECHNE_ANY:-}  # 1: build against any ../techne (see Dockerfile)
      pull: true
      additional_contexts:
        techne: ../techne
        liminal: ../liminal
    container_name: cabal-dev
    restart: unless-stopped
    environment:
      CABAL_MASTER_KEY: ${CABAL_MASTER_KEY:?CABAL_MASTER_KEY must be set — run `make up` to auto-generate}
    ports:
      - "127.0.0.1:7400:7400"
    volumes:
      - cabal-dev-data:/data
      # CABAL_IDENTITY_FILE lets test-docker.sh supply the HOST-absolute path
      # when compose runs inside a socket-mounted container. Relative path is
      # fine for normal local use (make up from the repo root).
      - ${CABAL_IDENTITY_FILE:-./compose/identity.dev.toml}:/app/identity.toml:ro
    networks:
      - cabal-dev

  liminal:
    build:
      context: ../liminal
      dockerfile: Dockerfile
      args:
        APT_REFRESH: ${APT_REFRESH:-unset}   # make exports the date; see Dockerfile
        TECHNE_ANY_VERSION: ${TECHNE_ANY:-}  # 1: build against any ../techne (see liminal's Dockerfile)
      pull: true
      additional_contexts:
        techne: ../techne
    container_name: liminal-dev
    restart: unless-stopped
    environment:
      LIMINAL_CABAL_TOKEN: ${LIMINAL_CABAL_TOKEN:-}
    command:
      - liminal
      - serve
      - --host=0.0.0.0
      - --port=9100
      - --jwks-url=http://cabal:7400/.well-known/jwks.json
      - --cabal-url=http://cabal:7400
    ports:
      - "127.0.0.1:9100:9100"
    depends_on:
      cabal:
        condition: service_healthy
    networks:
      - cabal-dev

volumes:
  cabal-dev-data:

networks:
  cabal-dev:
    driver: bridge
